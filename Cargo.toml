[package]
name = "site-xray"
version = "0.1.0"
edition = "2021"
description = "Site X-Ray — one command to find the cleanest way to get open data from any site without a browser"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate", "charset", "http2", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
scraper = "0.20"
url = "2"
flate2 = "1"
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
